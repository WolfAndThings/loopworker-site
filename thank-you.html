<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Request received | LoopWorker</title>
  <link rel="canonical" href="https://www.loopworker.com/thank-you.html">
  <script defer data-domain="loopworker.com" src="https://plausible.io/js/script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F2F1EE; --ink: #0E0E0E; --ink-2: #4A4A47; --accent: #E0482A; --font: "Archivo", "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    header, main, footer { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 40px; }
    header { height: 72px; display: flex; align-items: center; }
    .logo { font-weight: 800; font-stretch: 118%; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 64px; padding-bottom: 96px; }
    h1 { font-size: clamp(44px, 7vw, 104px); font-weight: 800; font-stretch: 116%; letter-spacing: -0.045em; line-height: .95; max-width: 14ch; }
    h1 em { font-style: normal; color: var(--accent); }
    p { color: var(--ink-2); font-size: 20px; max-width: 46ch; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 40px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 17px 26px; align-self: flex-start; }
    .btn::after { content: "\2192"; }
    .btn:hover { background: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    footer { padding-top: 24px; padding-bottom: 32px; font-size: 15px; color: var(--ink-2); }
    footer a { color: var(--ink); }
    @media (max-width: 600px) { header, main, footer { padding-left: 16px; padding-right: 16px; } p { font-size: 18px; } }
  </style>
</head>
<body>
  <header><a href="/" class="logo">LoopWorker</a></header>
  <main>
    <h1>Your request <em>is in.</em></h1>
    <p>Thanks for sending your firm. I'll review the information and follow up using the email you provided.</p>
    <a href="/" class="btn">Back to LoopWorker</a>
  </main>
  <footer><a href="mailto:alex@loopworker.com">alex@loopworker.com</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer>
  <script defer src="/site-runtime.js"></script>
</body>
</html>
