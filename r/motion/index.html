<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Three dishes, in motion</title>
<style>
  :root { --ink:#1c1b19; --soft:#6f6a63; --line:#e2ddd5; --bg:#faf8f5; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:44px 20px 72px; }
  h1 { font-size:27px; margin:0 0 10px; letter-spacing:-.01em; }
  .lede { color:var(--soft); margin:0 0 32px; max-width:56ch; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:12px; }
  figcaption { font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--soft); margin-bottom:10px; }
  video { width:100%; display:block; border-radius:5px; background:#eee; }
  footer { color:var(--soft); font-size:14px; border-top:1px solid var(--line);
    padding-top:18px; margin-top:32px; max-width:60ch; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
</style></head>
<body><main>
<h1>Three dishes, in motion</h1>
<p class="lede">Each of these started as a single still photograph of a plate. No shoot
day, no camera in the room. The food does not move and nothing is added to it or taken
off it.</p>
<div class="grid">
<figure>
  <figcaption>Salmon, chef-driven room</figcaption>
  <video src="/r/motion/1.mp4" autoplay loop muted playsinline></video>
</figure>
<figure>
  <figcaption>Chicken sandwich, gastropub</figcaption>
  <video src="/r/motion/2.mp4" autoplay loop muted playsinline></video>
</figure>
<figure>
  <figcaption>Filet, steakhouse</figcaption>
  <video src="/r/motion/3.mp4" autoplay loop muted playsinline></video>
</figure>
</div>
<footer>Alex Lamb, LoopWorker. Restaurant names left off on purpose.</footer>
</main></body></html>
