<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Three dishes, reshot</title>
<style>
  :root { --ink:#1c1b19; --soft:#6f6a63; --line:#e2ddd5; --bg:#faf8f5; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:44px 20px 72px; }
  h1 { font-size:27px; margin:0 0 10px; letter-spacing:-.01em; }
  .lede { color:var(--soft); margin:0 0 34px; max-width:56ch; }
  figure { margin:0 0 34px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:16px; }
  figcaption { font-size:13px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--soft); margin-bottom:12px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pair img { width:100%; display:block; border-radius:5px; background:#eee; }
  .pair span { display:block; font-size:12px; color:var(--soft); padding-top:6px; }
  footer { color:var(--soft); font-size:14px; border-top:1px solid var(--line);
    padding-top:18px; max-width:60ch; }
  @media (max-width:560px) { .pair { grid-template-columns:1fr; } }
</style></head>
<body><main>
<h1>Three dishes, reshot</h1>
<p class="lede">Each left image was already on that restaurant's Google listing. The right
one is the same dish, same plate, relit and restaged. Nothing was added to the food and
nothing was taken off it.</p>
<figure>
  <figcaption>Salmon, chef-driven room</figcaption>
  <div class="pair">
    <div><img src="/r/travail-collective/b1.jpg" alt="before"><span>on the listing now</span></div>
    <div><img src="/r/travail-collective/a1.jpg" alt="after"><span>reshot</span></div>
  </div>
</figure>
<figure>
  <figcaption>Chicken sandwich, gastropub</figcaption>
  <div class="pair">
    <div><img src="/r/lowlands-group/b1.jpg" alt="before"><span>on the listing now</span></div>
    <div><img src="/r/lowlands-group/a1.jpg" alt="after"><span>reshot</span></div>
  </div>
</figure>
<figure>
  <figcaption>Filet, steakhouse</figcaption>
  <div class="pair">
    <div><img src="/r/parasole-restaurant-holdings/b2.jpg" alt="before"><span>on the listing now</span></div>
    <div><img src="/r/parasole-restaurant-holdings/a2.jpg" alt="after"><span>reshot</span></div>
  </div>
</figure>
<footer>Alex Lamb, LoopWorker. Restaurant names left off on purpose.</footer>
</main></body></html>
