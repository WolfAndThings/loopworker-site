<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Olde Pink House, one dish reshot</title>
<style>
  :root { --ink:#1c1b19; --soft:#6f6a63; --line:#e2ddd5; --bg:#faf8f5; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:44px 20px 72px; }
  h1 { font-size:26px; margin:0 0 10px; letter-spacing:-.01em; }
  .lede { color:var(--soft); margin:0 0 30px; max-width:56ch; }
  figure { margin:0; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:16px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pair img { width:100%; display:block; border-radius:5px; background:#eee; }
  .pair span { display:block; font-size:12px; color:var(--soft); padding-top:6px; }
  footer { color:var(--soft); font-size:14px; border-top:1px solid var(--line);
    padding-top:18px; margin-top:30px; max-width:60ch; }
  @media (max-width:560px) { .pair { grid-template-columns:1fr; } }
</style></head>
<body><main>
<h1>The Olde Pink House</h1>
<p class="lede">The photo on the left is already on your Google listing. The one on the
right is the same dish on the same plate, relit and restaged. Nothing was added to the
food and nothing was taken off it.</p>
<figure><div class="pair">
  <div><img src="/r/v/the-olde-pink-house/b.jpg" alt="on the listing now"><span>on your listing now</span></div>
  <div><img src="/r/v/the-olde-pink-house/a.jpg" alt="reshot"><span>reshot</span></div>
</div></figure>
<footer>Alex Lamb, LoopWorker. Both files are yours either way.</footer>
</main></body></html>
